apiVersion: v1
kind: ResourceQuota
metadata:
  name: travelo-quota
  namespace: travelo
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi
    pods: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: travelo-limit-range
  namespace: travelo
spec:
  limits:
    - default:
        cpu: "500m"
        memory: "512Mi"
      defaultRequest:
        cpu: "100m"
        memory: "128Mi"
      max:
        cpu: "1000m"
        memory: "1Gi"
      min:
        cpu: "50m"
        memory: "64Mi"
      type: Container

